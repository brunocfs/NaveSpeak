<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NaveSpeak</title>
    <!-- Ícone do app: SVG (nítido em qualquer tamanho/DPI), com variante clara
         pro tab bar claro e escura pro escuro - mesmo par de assets já usado
         como logo em LoginPage/RoomsPage (nvspk.svg / nvspk-dark.svg), só
         copiado pra public/ com nome de favicon pra não depender do hash de
         build do Vite. PNG como fallback pra navegador sem suporte a favicon
         SVG (ainda existe, embora raro hoje). -->
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: light)" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: dark)" href="/favicon-dark.svg" />
    <link rel="icon" type="image/png" href="/favicon-256.png" />
    <link rel="apple-touch-icon" href="/favicon-256.png" />
    <!-- Fontes do painel de apresentação em LoginPage.jsx (headline/eyebrow) -
         mapeadas pra font-display/font-signal via @theme em styles/index.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
