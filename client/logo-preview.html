<!doctype html>
<!-- Preview das logos novas (NavespeakLogoV*.jsx) pra validação. Rodar
     `npm run dev` e abrir /logo-preview.html. Apagar junto com as versões
     descartadas quando uma for aprovada. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Logo NaveSpeak - preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement as h, useState } from "react";
      import { createRoot } from "react-dom/client";
      import "/src/styles/index.css";
      import V1 from "/src/components/NavespeakLogoV1.jsx";
      import V2 from "/src/components/NavespeakLogoV2.jsx";
      import V3 from "/src/components/NavespeakLogoV3.jsx";
      import V4 from "/src/components/NavespeakLogoV4.jsx";
      import V5 from "/src/components/NavespeakLogoV5.jsx";
      import V6 from "/src/components/NavespeakLogoV6.jsx";
      import Landing from "/src/components/NavespeakLanding.jsx";
      import oldLogo from "/src/assets/nvspk.svg";
      import oldLogoDark from "/src/assets/nvspk-dark.svg";

      const versions = [
        ["V1", V1],
        ["V2", V2],
        ["V3", V3],
        ["V4", V4],
        ["V5", V5],
        ["V6", V6],
      ];

      const panel = (dark) =>
        h(
          "div",
          { className: `${dark ? "dark bg-[#0f1117] text-slate-100" : "bg-white text-slate-900"} flex flex-1 flex-col items-center gap-8 p-10` },
          h("p", { className: "text-sm text-slate-500" }, dark ? "Escuro" : "Claro", " - passe o mouse"),
          ...versions.map(([name, Logo]) =>
            h(
              "div",
              { key: name, className: "flex flex-col items-center gap-4" },
              h("p", { className: "text-xs font-semibold text-slate-500" }, name),
              h(Logo, { className: "h-56 w-56" }),
              h(
                "div",
                { className: "flex items-end gap-6" },
                h(Logo, { className: "h-14 w-14" }),
                h(Logo, { className: "h-10 w-10" }),
                h(Logo, { className: "h-6 w-6" }),
              ),
            ),
          ),
          h("p", { className: "text-xs text-slate-500" }, "Atual:"),
          h("img", { src: dark ? oldLogoDark : oldLogo, className: "h-24 w-24" }),
        );

      // Pouso roda uma vez ao montar - "Repetir" remonta trocando a key.
      function LandingPanel({ dark }) {
        const [run, setRun] = useState(0);
        return h(
          "div",
          { className: `${dark ? "dark bg-[#0f1117] text-slate-100" : "bg-white text-slate-900"} flex flex-1 flex-col items-center gap-4 p-10` },
          h("p", { className: "text-xs font-semibold text-slate-500" }, "Animação de decolagem e pouso (V1)"),
          h(Landing, { key: run, className: "h-72 w-72" }),
          h(
            "button",
            {
              type: "button",
              onClick: () => setRun((n) => n + 1),
              className:
                "cursor-pointer rounded-xl bg-purple-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-purple-700 dark:bg-purple-500 dark:hover:bg-purple-400",
            },
            "Repetir",
          ),
        );
      }

      createRoot(document.getElementById("root")).render(
        h(
          "div",
          null,
          h("div", { className: "flex" }, h(LandingPanel, { dark: false }), h(LandingPanel, { dark: true })),
          h("div", { className: "flex min-h-screen" }, panel(false), panel(true)),
        ),
      );
    </script>
  </body>
</html>
